[platformio]
default_envs = solar_term

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/platformio_solaros_flavor.py

[env:solar_term]
board = solar_term
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=solar_term

[env:freenove_esp32_s3_display_4_0]
board = freenove_esp32_s3_display_4_0
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=freenove_esp32_s3_display_4_0

[env:esp32_s3_devkitc1_n16r8]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=esp32_s3_devkitc1_n16r8

[env:waveshare_esp32_s3_sim7670g_4g]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=waveshare_esp32_s3_sim7670g_4g -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.waveshare_esp32_s3_sim7670g_4g

[env:cl_32]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=cl_32

[env:esp32_devkitc_v4_wrover]
board = freenove_esp32_wrover
board_build.partitions = partitions_4mb.csv
board_upload.maximum_size = 3997696
custom_solaros_default_flavor = rover
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=esp32_devkitc_v4_wrover -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.freenove_esp32_wrover_v3

[env:odroid_go]
board = odroid_esp32
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=odroid_go -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.odroid_go

[env:freenove_esp32_wrover_v3]
board = freenove_esp32_wrover
board_build.partitions = partitions_4mb.csv
board_upload.maximum_size = 3997696
custom_solaros_default_flavor = rover
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=freenove_esp32_wrover_v3 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.freenove_esp32_wrover_v3

[env:elecrow_crowpanel_esp32_s3_4_2_epaper]
board = elecrow_crowpanel_esp32_s3_4_2_epaper
board_build.partitions = partitions_8mb.csv
custom_solaros_default_flavor = writerdeck
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=elecrow_crowpanel_esp32_s3_4_2_epaper -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.elecrow_crowpanel_esp32_s3_4_2_epaper

[env:t_lora_pager]
board = t_lora_pager
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=t_lora_pager -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.t_lora_pager

[env:t_deck_plus]
board = t_deck_plus
custom_solaros_default_flavor = full
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=t_deck_plus -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.t_deck_plus

[env:ttgo_vga32_v14]
board = ttgo-t7-v14-mini32
board_build.partitions = partitions_4mb.csv
board_upload.maximum_size = 3997696
custom_solaros_default_flavor = vga32
board_build.cmake_extra_args = -DSOLAR_OS_BOARD=ttgo_vga32_v14 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.ttgo_vga32_v14

; SuperKeyboard CPU v2 bring-up. Intentionally independent of ESP-IDF/flavors.
[env:teensy41]
platform = https://github.com/tsandmann/platform-teensy.git#f2a89fab6fbe936dc383a6565872eb30545984a6
board = teensy41
framework = arduino
extra_scripts =
lib_ldf_mode = chain+
board_build.partitions =
lib_deps =
    https://github.com/tsandmann/freertos-teensy.git#b1943409de50e0514469ae0fc69a6f9ae17f6118
build_flags =
    -DUSB_SERIAL
    -DUSE_ARDUINO_DEFINES
    ; Match startup.c's MPU guard at _estack - 8192. The RTOS default is 4096.
    -DconfigMAIN_STACK_DEPTH=8192
    -DSOLAR_OS_PLATFORM_IMXRT1062=1
    -DSOLAR_OS_HEADLESS=1
    -Isrc
    -Isrc/services
    -Isrc/shell
    -Isrc/platform/imxrt1062/teensy41
    -Isrc/platform/imxrt1062/teensy41/compat
build_src_filter =
    -<*>
    +<platform/imxrt1062/teensy41/*.cpp>
    +<solar_os.c>
    +<solar_os_queue.c>
    +<shell/solar_os_shell_parse.c>
    +<shell/solar_os_shell_line.c>
    +<services/solar_os_expr.c>
upload_protocol = teensy-cli

; Compile coverage only: these controller/wiring assumptions are unconfirmed.
; Do not upload this environment until doc/ports/teensy41.md prerequisites hold.
[env:teensy41_peripheral_check]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DSK_PRIMARY_RA8875=1
    -DSK_SECONDARY_ST7735=1
    -DSK_USB_HOST=1
    -DSK_AUDIO_SGTL5000=1

; Temporary SPI0 wiring, Adafruit RA8875 board with likely 800x480 panel.
; LCD-only bring-up console; this is not the combined synth/apps firmware.
[env:teensy41_lcd]
extends = env:teensy41
build_flags =
    ${env:teensy41.build_flags}
    -DSK_PRIMARY_RA8875=1
    -DSK_PRIMARY_CS=37
    -DSK_PRIMARY_RESET=9
    -DSK_PRIMARY_PANEL=Adafruit_800x480
    -DSK_PRIMARY_ROTATION=0

; Shared upstream serial shell; bring-up target remains available for recovery.
[env:teensy41_shell]
extends = env:teensy41
extra_scripts = pre:scripts/platformio_teensy_micropython.py
build_flags =
    ${env:teensy41.build_flags}
    -Wl,--wrap=fopen,--wrap=stat,--wrap=fileno,--wrap=fstat,--wrap=open,--wrap=read,--wrap=write,--wrap=close,--wrap=lseek,--wrap=fsync,--wrap=mkdir,--wrap=rmdir,--wrap=unlink,--wrap=remove,--wrap=rename
    -DSK_UPSTREAM_SHELL=1
    -DSOLAR_OS_SHELL_CORE_ONLY=1
    -DSOLAR_OS_BOARD_GENERATED=1
    -Isrc/apps
    -Isrc/jobs
    -Icomponents/u8g2/src/clib
build_src_filter =
    ${env:teensy41.build_src_filter}
    +<platform/imxrt1062/teensy41/*.c>
    +<apps/solar_os_app_registry.c>
    +<apps/solar_os_app_file_types.c>
    +<apps/solar_os_edit.c>
    +<services/solar_os_tui.c>
    +<services/solar_os_tui_widgets.c>
    +<services/solar_os_syntax.c>
    +<services/solar_os_text_search.c>
    +<apps/solar_os_calc.c>
    +<apps/solar_os_shell.c>
    +<apps/solar_os_shell_startup_policy.c>
    +<shell/solar_os_shell_io.c>
    +<shell/solar_os_shell_common.c>
    +<shell/solar_os_shell_completion.c>
    +<shell/solar_os_shell_launch.c>
    +<shell/solar_os_shell_fs.c>
    +<shell/solar_os_vt100.c>
    +<services/solar_os_port.c>
    +<services/solar_os_stream.c>
    +<services/solar_os_clipboard.c>

; Rev D audio shield. Keep the validated shell/recovery profiles independent.
[env:teensy41_audio]
extends = env:teensy41_shell
build_flags =
    ${env:teensy41_shell.build_flags}
    -DSK_AUDIO_SGTL5000=1
    -DSK_AUDIO_PLAYER=1
    -DSOLAR_OS_AUDIO_APP_SYNCHRONOUS=1
    -Icomponents/minimp3/include
    -DMINIMP3_NO_SIMD
    -DMINIMP3_ONLY_MP3
    -fstack-usage
build_src_filter =
    ${env:teensy41_shell.build_src_filter}
    +<apps/solar_os_audio_apps.c>
    +<services/solar_os_audio_codec.c>
    +<services/solar_os_audio_pcm.c>

; Native Ethernet via the PJRC six-pin kit. Starts only on `network up`.
[env:teensy41_network]
extends = env:teensy41_audio
extra_scripts =
    pre:scripts/platformio_teensy_micropython.py
    post:scripts/platformio_teensy_network.py
lib_deps =
    ${env:teensy41.lib_deps}
    https://github.com/ssilverman/QNEthernet.git#ce1977ecb7af916083d5d3435270bc5585e296a8
build_flags =
    ${env:teensy41_audio.build_flags}
    -DSK_ETHERNET=1
    -DSK_QSPI_FLASH=1
    -Wl,--wrap=lfs_format,--wrap=lfs_mount
    -DQNETHERNET_DO_LOOP_IN_YIELD=0
    -DMEM_LIBC_MALLOC=0
    -DSOLAR_OS_NET_PORT_TRANSPORT=1
    -DSOLAR_OS_NETWORK_VOLATILE=1
    -DSOLAR_OS_NETWORK_TRANSPORT_COMMAND=1
build_src_filter =
    ${env:teensy41_audio.build_src_filter}
    +<services/solar_os_network.c>
    +<services/solar_os_net_session.c>
    +<shell/solar_os_shell_network_status.c>

; SSH integration keeps the tested network recovery profile independent.
[env:teensy41_ssh]
extends = env:teensy41_network
extra_scripts =
    pre:scripts/platformio_teensy_micropython.py
    post:scripts/platformio_teensy_network.py
    post:scripts/platformio_teensy_ssh.py
build_flags =
    ${env:teensy41_network.build_flags}
    -DSK_SSH=1
    -DSOLAR_OS_SSH_PORT_TRANSPORT=1
    -Isrc/platform/imxrt1062/teensy41/ssh_compat
build_src_filter =
    ${env:teensy41_network.build_src_filter}
    +<apps/solar_os_ssh.c>
    +<services/solar_os_ssh.c>
    +<services/solar_os_ssh_transport.c>
    +<services/solar_os_ssh_keys.c>
    +<services/solar_os_crypto.c>

; File manager uses shared storage, TUI and child-app lifecycle services.
[env:teensy41_files]
extends = env:teensy41_ssh
; Full newlib supports the shared apps' 64-bit size/progress formatting.
; Remove nano specs from compilation as well as linking to keep reent ABI consistent.
build_unflags = --specs=nano.specs
extra_scripts =
    ${env:teensy41_ssh.extra_scripts}
    post:scripts/platformio_teensy_files.py
build_flags =
    ${env:teensy41_ssh.build_flags}
    -DSK_FILES=1
build_src_filter =
    ${env:teensy41_ssh.build_src_filter}
    +<apps/solar_os_files.c>
    +<services/solar_os_zip.c>

; Persistent flash settings and shared terminal applications.
[env:teensy41_apps]
extends = env:teensy41_files
extra_scripts =
    ${env:teensy41_files.extra_scripts}
    pre:scripts/platformio_teensy_apps.py
build_flags =
    ${env:teensy41_files.build_flags}
    -DSK_SETTINGS=1
    -DSOLAR_OS_IDENTITY_DEFAULT_HOSTNAME=\"teensy41\"
    -DSK_TEXT_APPS=1
build_src_filter =
    ${env:teensy41_files.build_src_filter}
    +<services/solar_os_identity.c>
    +<services/solar_os_manual.c>
    +<apps/solar_os_less.c>
    +<apps/solar_os_notes.c>
    +<apps/solar_os_sheet.c>

; Shared voice engine with Teensy PCM output and terminal instrument controls.
[env:teensy41_synth]
extends = env:teensy41_apps
build_flags =
    ${env:teensy41_apps.build_flags}
    -DSK_SYNTH=1
build_src_filter =
    ${env:teensy41_apps.build_src_filter}
    +<services/solar_os_synth_voice.c>
    +<services/solar_os_dsp.c>

; Independent LCD/USB terminals with the integrated application profile.
[env:teensy41_display]
extends = env:teensy41_synth
build_flags =
    ${env:teensy41_synth.build_flags}
    -DSK_PRIMARY_RA8875=1
    -DSK_PRIMARY_CS=37
    -DSK_PRIMARY_RESET=9
    -DSK_PRIMARY_PANEL=Adafruit_800x480
    -DSK_PRIMARY_ROTATION=0
    -DSK_USB_HOST=1
    -DSK_LCD_CONSOLE=1
    -DSK_PLOT=1
    -DSK_PLAYGROUND=1
    -DSOLAR_OS_PLAYGROUND_SCRIPT_GFX=0
    -DSOLAR_OS_PORT_GFX=1
build_unflags = --specs=nano.specs
extra_scripts =
    ${env:teensy41_apps.extra_scripts}
    post:scripts/platformio_teensy_playground.py
build_src_filter =
    ${env:teensy41_synth.build_src_filter}
    +<apps/solar_os_plot.c>
    +<apps/solar_os_playground_app.c>
    +<services/solar_os_playground.c>
    +<services/solar_os_json.c>
    +<services/solar_os_board_caps.c>
